services:
  ingestion:
    build: .
    user: "10001:10001"
    environment:
      MUSASHI_BIND: 0.0.0.0
      MUSASHI_PORT: 8080
      MUSASHI_DATA_DIR: /data
      OPERATOR_USERNAME: ${OPERATOR_USERNAME-admin}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD-00000000}
      MUSASHI_PUBLIC_ORIGIN: ${MUSASHI_PUBLIC_ORIGIN-}
      MUSASHI_ALLOWED_ORIGINS: ${MUSASHI_ALLOWED_ORIGINS:-*}
    ports:
      - "${MUSASHI_WEB_BIND:-0.0.0.0}:8080:8080"
    volumes:
      - musashi_data:/data
    restart: unless-stopped
volumes:
  musashi_data:
