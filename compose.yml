services:
  ingestion:
    build: .
    user: "10001:10001"
    environment:
      MUSASHI_BIND: 0.0.0.0
      MUSASHI_PORT: 8080
      MUSASHI_DATA_DIR: /data
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:?Set a nonempty OPERATOR_TOKEN}
    ports:
      - "${MUSASHI_WEB_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - musashi_data:/data
    restart: unless-stopped
volumes:
  musashi_data:
